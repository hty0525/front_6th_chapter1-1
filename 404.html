<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>상품 쇼핑몰</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							primary: "#3b82f6",
							secondary: "#6b7280",
						},
					},
				},
			};
		</script>
		<script>
			(function (pathSegmentsToKeep) {
				var l = window.location;
				// 이미 '/?/' 형태로 리다이렉트된 경우, 재실행 금지
				if (l.search.indexOf("/?/") === 0) return;

				var protocolAndHost =
					l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "");
				// 보존할 첫 번째 세그먼트(리포지토리명 등) 추출
				var basePath = l.pathname
					.split("/")
					.slice(0, 1 + pathSegmentsToKeep)
					.join("/");
				// 나머지 경로
				var restPath = l.pathname
					.split("/")
					.slice(1 + pathSegmentsToKeep)
					.join("/");
				// 원본 쿼리와 해시 그대로 붙이기
				var queryAndHash = (l.search || "") + (l.hash || "");

				// 최종 리다이렉트 URL
				var newUrl =
					protocolAndHost + basePath + "/?/" + restPath + queryAndHash;

				l.replace(newUrl);
			})(1);
		</script>
	</head>
	<body class="bg-gray-50">
		<!-- 메인 앱 컨테이너 -->
		<div id="root"></div>

		<!-- 리다이렉트 실패시 대체 콘텐츠 -->
		<div id="fallback-content" style="display: none">
			<!-- Header -->
			<header class="bg-white shadow-sm sticky top-0 z-40">
				<div class="max-w-md mx-auto px-4 py-4">
					<div class="flex items-center justify-between">
						<h1 class="text-xl font-bold text-gray-900">
							<a href="/front_6th_chapter1-1/">404 페이지</a>
						</h1>
					</div>
				</div>
			</header>

			<!-- Main Content -->
			<main class="max-w-md mx-auto px-4 py-4">
				<div class="text-center my-4 py-20 shadow-md p-6 bg-white rounded-lg">
					<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient
								id="blueGradient"
								x1="0%"
								y1="0%"
								x2="100%"
								y2="100%"
							>
								<stop
									offset="0%"
									style="stop-color: #4285f4; stop-opacity: 1"
								/>
								<stop
									offset="100%"
									style="stop-color: #1a73e8; stop-opacity: 1"
								/>
							</linearGradient>
							<filter
								id="softShadow"
								x="-50%"
								y="-50%"
								width="200%"
								height="200%"
							>
								<feDropShadow
									dx="0"
									dy="2"
									stdDeviation="8"
									flood-color="#000000"
									flood-opacity="0.1"
								/>
							</filter>
						</defs>

						<!-- 404 Numbers -->
						<text
							x="160"
							y="85"
							font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
							font-size="48"
							font-weight="600"
							fill="url(#blueGradient)"
							text-anchor="middle"
						>
							404
						</text>

						<!-- Icon decoration -->
						<circle cx="80" cy="60" r="3" fill="#e8f0fe" opacity="0.8" />
						<circle cx="240" cy="60" r="3" fill="#e8f0fe" opacity="0.8" />
						<circle cx="90" cy="45" r="2" fill="#4285f4" opacity="0.5" />
						<circle cx="230" cy="45" r="2" fill="#4285f4" opacity="0.5" />

						<!-- Message -->
						<text
							x="160"
							y="110"
							font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
							font-size="14"
							font-weight="400"
							fill="#5f6368"
							text-anchor="middle"
						>
							페이지를 찾을 수 없습니다
						</text>

						<!-- Subtle bottom accent -->
						<rect
							x="130"
							y="130"
							width="60"
							height="2"
							rx="1"
							fill="url(#blueGradient)"
							opacity="0.3"
						/>
					</svg>

					<a
						href="/front_6th_chapter1-1/"
						class="inline-block px-6 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors"
						>홈으로</a
					>
				</div>
			</main>

			<!-- Footer -->
			<footer class="bg-white shadow-sm sticky top-0 z-40">
				<div class="max-w-md mx-auto py-8 text-center text-gray-500">
					<p>© 2025 항해플러스 프론트엔드 쇼핑몰</p>
				</div>
			</footer>
		</div>
	</body>
</html>
